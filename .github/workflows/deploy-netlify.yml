# Deploy zu Netlify

name: Deploy Netlify

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

permissions:
  contents: read

# Nur ein Netlify-Deployment gleichzeitig; laufende werden nicht abgebrochen
concurrency:
  group: netlify
  cancel-in-progress: false

jobs:
  deploy:
    # Netlify-Prod-Deploy nur im Account "tobiasbenkner". Der Account "carmenbereiter"
    # nutzt stattdessen GitHub Pages — siehe deploy-github.yml.
    if: github.repository_owner == 'tobiasbenkner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Deploy to Netlify
        run: pnpm netlify deploy --dir=dist --prod --message="Deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
