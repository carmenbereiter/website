# Branch-Preview auf Netlify (kein Live-Deploy)

name: Deploy Netlify Preview

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

permissions:
  contents: read
  pull-requests: write
  issues: write

# Pro Branch nur ein laufender Preview-Build; ältere werden abgebrochen
concurrency:
  group: netlify-preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Deploy preview to Netlify
        id: deploy
        run: |
          # Branch-Namen als stabilen Alias verwenden (nur erlaubte Zeichen)
          ALIAS=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-37)
          pnpm netlify deploy --dir=dist --alias="$ALIAS" --message="Preview ${{ github.sha }}" --json > deploy.json
          echo "url=$(node -p "require('./deploy.json').deploy_url")" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$(node -p "require('./deploy.json').deploy_id")" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment preview URL on PR and linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const deployId = '${{ steps.deploy.outputs.deploy_id }}';
            const marker = '<!-- netlify-preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha.slice(0, 7);

            // Vorhandenen Preview-Kommentar in einem Issue/PR finden (per Marker)
            async function findComment(issue_number) {
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
              return comments.find((c) => c.body.includes(marker));
            }
            // Kommentar anlegen oder aktualisieren (kein Spam bei mehreren Pushes)
            async function upsert(issue_number, body) {
              const existing = await findComment(issue_number);
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

            // 1) PR-Kommentar inkl. versteckter Deploy-ID-Liste (für späteres Cleanup)
            const prNumber = context.issue.number;
            let ids = [];
            const prComment = await findComment(prNumber);
            if (prComment) {
              const m = prComment.body.match(/<!-- deploy-ids: (.*?) -->/);
              if (m) { try { ids = JSON.parse(m[1]); } catch (e) {} }
            }
            if (deployId && !ids.includes(deployId)) ids.push(deployId);
            const prBody = `${marker}\n🔍 **Netlify Preview** bereit: ${url}\n\n_Commit ${sha} — Kunde kann diesen Link sehen, ohne dass die Live-Seite betroffen ist._\n<!-- deploy-ids: ${JSON.stringify(ids)} -->`;
            await upsert(prNumber, prBody);

            // 2) Gleiche Vorschau-URL zusätzlich ins verknüpfte Issue posten (aus "Closes #N" im PR-Body)
            const prText = context.payload.pull_request.body || '';
            const im = prText.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (im) {
              const issueNumber = Number(im[1]);
              const issueBody = `${marker}\n🔍 **Vorschau deiner Änderung** ist bereit: ${url}\n\nDort siehst du direkt, wie es aussieht. Passt alles? Dann schreib im Pull Request „passt". Möchtest du noch etwas ändern? Schreib es einfach hier als Kommentar mit @claude.`;
              await upsert(issueNumber, issueBody);
            } else {
              core.info('Kein verknüpftes Issue (Closes #N) im PR-Body gefunden – nur PR kommentiert.');
            }
