# Löscht die Netlify-Preview-Deploys, wenn ein PR gemerged oder geschlossen wird

name: Cleanup Netlify Preview

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview deploys
        uses: actions/github-script@v7
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        with:
          script: |
            const marker = '<!-- netlify-preview -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const comment = comments.find((c) => c.body.includes(marker));
            if (!comment) {
              core.info('Kein Preview-Kommentar gefunden – nichts zu löschen.');
              return;
            }
            const m = comment.body.match(/<!-- deploy-ids: (.*?) -->/);
            const ids = m ? JSON.parse(m[1]) : [];
            if (!ids.length) {
              core.info('Keine Deploy-IDs im Kommentar gefunden – nichts zu löschen.');
              return;
            }
            const token = process.env.NETLIFY_AUTH_TOKEN;
            let deleted = 0;
            for (const id of ids) {
              // Netlify schützt den aktuell veröffentlichten Prod-Deploy ohnehin vor dem Löschen
              const res = await fetch(`https://api.netlify.com/api/v1/deploys/${id}`, {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${token}` },
              });
              if (res.ok || res.status === 404) {
                deleted++;
              } else {
                core.warning(`Deploy ${id} konnte nicht gelöscht werden: HTTP ${res.status}`);
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🧹 Aufgeräumt: ${deleted}/${ids.length} Netlify-Preview-Deploy(s) gelöscht.`,
            });
